name: Portable setup checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_privacy.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts workspace
      - run: bash -n install.sh .githooks/pre-commit
